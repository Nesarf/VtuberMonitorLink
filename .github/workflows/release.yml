name: release

# 推 tag（形如 v1.7.0）→ 出便携 exe → 附到 GitHub Release
# 手动跑（workflow_dispatch）→ 只产出构建物，不发 Release
#
# 设计原则：**和本机发布完全同源**，避免「本机绿、CI 红」。
#   1) 先跑「不需要构建」的自检（完整性 / 词条时效 / 键粘连 / 日历 / 推送）——快，失败就停
#   2) 再用 tools/build-portable.cjs 出 exe 与 zip（**zip 与清单由它生成**，
#      不用 Compress-Archive 整目录压 —— 那样既没有清单、也无法断言
#      「包里没有运行期数据（config.json 里的 API Key、历史报告）」）
#   3) 最后跑完整 verify（含发行版结构检查）并附上 SHA256SUMS
#
# 注意 npm ci 必须 --ignore-scripts：playwright 的 postinstall 会去下 ~150MB 浏览器内核，
# 而便携 exe 根本不需要它（使用者在设置里指定自己的浏览器即可）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fast checks (integrity, locales, i18n keys, unit tests)
        run: npm run verify:fast

      - name: Build web UI, portable exe and release zip
        run: node tools/build-portable.cjs

      - name: Full verify (release layout, secrets, run data)
        run: npm run verify

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $name = "VtuberMonitorLink-${{ steps.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "dist/$name.zip" out/
          Copy-Item "dist/$name.zip.manifest.json" out/
          Get-ChildItem out | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content out/SHA256SUMS.txt -Encoding ASCII
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VtuberMonitorLink-win-x64
          path: out/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.manifest.json
            out/SHA256SUMS.txt
          generate_release_notes: true
