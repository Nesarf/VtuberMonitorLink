name: workers

# The multilingual worker layer, built and diffed on several platforms.
#
# This is what "Linux adaptation" means for this layer: the same contract, the same corpus, a
# different toolchain - and the same answer. It is a separate workflow from ci.yml on purpose, since
# nothing here is packaged into the release artifact yet and a red run must not be confused with a
# red release.
#
# What each platform runs, measured rather than assumed (anything absent is a [skip], never a
# failure). The interpreter list comes from the `--list` table each leg prints, and the versions from
# the probe step below:
#   linux   - the reference (node), java, cpp (g++), go, python3, pwsh, csharp (dotnet), perl 5.38,
#             bash 5.2
#   windows - the reference, java, cpp (g++ - this runner does have it, contrary to an earlier note
#             here), go, python, pwsh, csharp, perl 5.42 on cygwin, bash 5.3
#   macos   - the reference, java, cpp (clang++), go, python3, pwsh, csharp, perl 5.44, bash 3.2.57
#   no Rscript on the linux or macos image (measured, not assumed)
#
# The macOS leg is not in the push matrix as of BUGS #110, and both halves of that decision are
# measurements. It became a gating leg on evidence - it ran the whole corpus and the fuzzer green
# twice while it was only informational (8fd1d74 moved the C# worker onto `dotnet <dll>`, fb730ea
# fixed the Perl worker). It stopped being one on evidence too: from 2026-11-04 14:58 every run of it
# was cancelled with "The job was not acquired by Runner of type hosted", nine in a row, while ubuntu
# and windows passed on all nine commits. That is GitHub's hosted macOS arm64 capacity, neither a
# flake nor a product defect, and a gate that never starts covers nothing while its red hides the
# failures that are real.
#
# `continue-on-error` was tried first and does not fix it, which is also measured: with
# `experimental: true` in the matrix, run 41870457773 on 8d93b1d still ended `failure`, with
# `macos-latest` cancelled and both other legs green. The flag covers a job that runs and fails; it
# does not cover a job that is cancelled before it is ever assigned to a runner.
#
# So the leg is its own job now, and it runs where a queue is more likely to be able to serve it: one
# scheduled run a day and a manual dispatch. When it runs it is a real gate again - not a matrix flag
# claiming to be one - and it carries no `continue-on-error`, so a genuine failure there is a genuine
# failure. Promoting it back into the push matrix means two green acquired runs, recorded in
# docs/BUGS.md like the first promotion was.
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # 04:17 UTC daily. The hour is not load-bearing; having a queue that is not a burst of pushes is.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: workers (${{ matrix.os }})
    # Not on the daily schedule: that slot exists for the macOS leg, and two more full legs a day
    # would be spending minutes to re-learn what every push already answers.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Java is the one toolchain the runner does not ship, and java-text is in the published
      # registry, so it has to be here or the Linux job would silently skip a worker it should run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Go is present on the Linux and Windows runners but not on the macOS one, which is how the
      # first run of this job found out: the macOS job reported go-text as "no hint directories" and
      # the harness treated it as a skip. Installing it makes the platforms comparable, which is the
      # entire point of running more than one of them.
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go/go.mod
          cache: false

      # No `npm ci`: the harness and the reference implementation use Node's standard library only,
      # and a dependency-free layer that proves it on every push is worth more than a cache.
      - name: Build every implementation that can be built here, then diff the corpus
        run: node tools/workers.mjs

      # Measured rather than assumed. The Perl implementation lives in the machine-local overlay
      # because nobody had checked whether `perl` is on these runners; "it probably is" is not a
      # measurement, and the cheapest way to get one is to ask the runners. This step prints the
      # version or says it is absent and never fails, so the answer arrives in the log without
      # touching the gate.
      - name: Does this runner have Perl? (measured, not assumed)
        shell: bash
        run: |
          perl -e 'print "perl $^V on $^O\n"' 2>/dev/null || echo "perl: absent on this runner"

      # The next two promotion candidates out of the machine-local overlay, asked the same way and in
      # the same place. R is the case where the answer is genuinely open; the shell is the case where
      # presence is certain and the *version* is the question - macOS runner images ship bash 3.2, and
      # workers/bash/README.md says in as many words that the file has not been tested on Linux or
      # macOS bash. That worker's own self-check is deliberately NOT run here: it belongs under the
      # harness, which enforces a per-worker budget and kills a worker that overruns, whereas this step
      # has no timeout of its own and a hang here would be a hung job. Versions first, verdict later.
      - name: Do these runners have R and the shell the worker would need? (measured, not assumed)
        shell: bash
        run: |
          if command -v Rscript >/dev/null 2>&1; then Rscript --version 2>&1 | head -1; else echo "Rscript: absent on this runner"; fi
          if command -v bash >/dev/null 2>&1; then bash --version | head -1; else echo "bash: absent on this runner"; fi

      # The corpus is a floor, not a ceiling: this points the same diff at generated input, seeded so a
      # divergence is reproducible. It is what found the PowerShell worker rejecting every astral code
      # point, which the hand-written corpus had missed.
      - name: Diff the implementations over generated input
        shell: bash
        run: node tools/workers-diff.mjs --n 150 --seed 20260101

      - name: Report which implementations this platform ran
        if: always()
        shell: bash
        run: node tools/workers.mjs --list || true

      - name: Note a red run in the summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### workers: conformance failed on ${{ matrix.os }}"
            echo
            echo "Every implementation that answered agrees, or one of them does not follow the contract."
            echo "The DIVERGES lines name the implementations and show their answers side by side;"
            echo "docs/WORKERS.md section 5 says which of the two is at fault when they disagree."
          } >> "$GITHUB_STEP_SUMMARY"

  # The third platform, in the slot that can actually be served. The steps are the ones above on
  # purpose: the point of this leg is that the same contract and the same corpus produce the same
  # answers under clang++, perl 5.44 and bash 3.2.57, so running a reduced version of the harness would
  # answer a different question than the one it exists for. Only the trigger and the label differ.
  conformance-macos:
    name: workers (macos-latest)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go/go.mod
          cache: false

      - name: Build every implementation that can be built here, then diff the corpus
        run: node tools/workers.mjs

      - name: Does this runner have Perl? (measured, not assumed)
        shell: bash
        run: |
          perl -e 'print "perl $^V on $^O\n"' 2>/dev/null || echo "perl: absent on this runner"

      - name: Do these runners have R and the shell the worker would need? (measured, not assumed)
        shell: bash
        run: |
          if command -v Rscript >/dev/null 2>&1; then Rscript --version 2>&1 | head -1; else echo "Rscript: absent on this runner"; fi
          if command -v bash >/dev/null 2>&1; then bash --version | head -1; else echo "bash: absent on this runner"; fi

      - name: Diff the implementations over generated input
        shell: bash
        run: node tools/workers-diff.mjs --n 150 --seed 20260101

      - name: Report which implementations this platform ran
        if: always()
        shell: bash
        run: node tools/workers.mjs --list || true

      - name: Note a red run in the summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### workers: conformance failed on macos-latest"
            echo
            echo "Every implementation that answered agrees, or one of them does not follow the contract."
            echo "The DIVERGES lines name the implementations and show their answers side by side;"
            echo "docs/WORKERS.md section 5 says which of the two is at fault when they disagree."
          } >> "$GITHUB_STEP_SUMMARY"
