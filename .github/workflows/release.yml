name: release

# Push a tag (of the form v1.0.0) -> build the portable exe -> attach it to the GitHub Release
# Run it by hand (workflow_dispatch) -> produce the build artifacts only, no Release
#
# Design rule: **the exact same path as a local release**, so that "green locally, red in CI" cannot happen.
#   1) First the self-checks that need no build (integrity / locales / i18n keys / calendar / push) -- fast, and a failure stops there
#   2) Then tools/build-portable.cjs produces the exe and the zip (**it generates the zip and the manifest**;
#      do not compress the whole directory with Compress-Archive -- that gives you no manifest and cannot assert
#      "the package contains no runtime data (the API key in config.json, past reports)")
#   3) Finally the full verify (including the release layout check) plus SHA256SUMS
#
# Note that npm ci has to pass --ignore-scripts: playwright's postinstall downloads a ~150MB browser engine,
# and the portable exe does not need it at all (users point at their own browser in the settings).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # The engine, for the same reason the fast job has it (see ci.yml): a check inside `verify:fast` renders
    # a real page, so without an engine this job reports this machine's environment instead of the product.
    # This was found the hard way - the first release cut after tools/render-timeout-test.mjs landed was red
    # with six unrelated-looking failures, all of them "Executable doesn't exist", because the fast job had
    # been given the engine and this one had not. The same path is the design rule at the top of this file;
    # a check in tools/integrity-check.mjs now holds the two workflow files to it.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the browser engine (Firefox) for the render check
        id: engine
        shell: pwsh
        timeout-minutes: 15
        run: |
          $target = $env:PLAYWRIGHT_BROWSERS_PATH
          Write-Host "engine root: $target"
          $ok = $false
          foreach ($attempt in 1..3) {
            # npx.cmd, not npx: pwsh does not resolve the extensionless shim the way cmd does.
            & npx.cmd --yes playwright install firefox
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning title=engine install attempt $attempt failed::npx playwright install firefox exited $LASTEXITCODE"
            Start-Sleep -Seconds (5 * $attempt)
          }
          $found = @(Get-ChildItem -Path $target -Directory -Filter 'firefox-*' -ErrorAction SilentlyContinue)
          if ($found.Count -gt 0) {
            Write-Host "engine present: $($found.Name -join ', ')"
          } else {
            Write-Host "::warning title=no engine installed::the render check will report this machine's environment instead of rendering, which is not a failure"
          }
          if (-not $ok) { Write-Host "the engine could not be downloaded; verify:fast still runs and will say so" }

      - name: Fast checks (integrity, locales, i18n keys, plural forms, unit tests)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'verify-fast.log'
          npm run verify:fast *> $log
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) {
            # The failing check by name, before the tail - the same annotation the fast job emits, because
            # the job log needs a token to read and a red release is exactly when it is needed most.
            $all = Get-Content $log
            $named = @()
            for ($i = 0; $i -lt $all.Count; $i++) {
              if ($all[$i] -match '\[FAIL\]|\bFAILED\b|AssertionError') {
                $prev = if ($i -gt 0 -and $all[$i - 1] -notmatch '^\s*\[ok\]') { $all[$i - 1].Trim() } else { '' }
                $named += (@($prev, $all[$i].Trim()) | Where-Object { $_ }) -join ' | '
              }
            }
            if ($named.Count -gt 0) {
              $f = (($named | Select-Object -First 12) -join "`n") -replace '%', '%25'
              $f = $f -replace "`r?`n", '%0A'
              Write-Host "::error title=the failing checks::$f"
            }
            $tail = (Get-Content $log -Tail 30) -join "`n"
            $tail = $tail -replace '%', '%25'
            $tail = $tail -replace "`r?`n", '%0A'
            Write-Host "::error title=verify:fast failed::$tail"
          }
          exit $code

      - name: Build web UI, portable package and release zip
        # The shipped layout has no SEA launcher binary: the package carries launcher/ plus a
        # bundled runtime/node.exe, and launcher/launch.cmd is what a user double-clicks. Building
        # it also skips the single most expensive stage of the old build (the SEA step, ~220 s).
        run: node tools/build-portable.cjs --no-exe

      - name: Full verify (release layout, secrets, run data)
        run: npm run verify

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      # The notes for this version must exist before anything is built. A release whose page says nothing is a
      # release whose reader has to guess what changed, and the check also refuses a section that is only a
      # heading - "the notes exist" and "the notes say something" are different claims.
      - name: The release notes for this version exist
        shell: pwsh
        run: node tools/release-notes.mjs --check "v${{ steps.version.outputs.version }}"

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $name = "VtuberMonitorLink-${{ steps.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "dist/$name.zip" out/
          Copy-Item "dist/$name.zip.manifest.json" out/
          Get-ChildItem out | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content out/SHA256SUMS.txt -Encoding ASCII
          # After the checksums on purpose: SHA256SUMS covers the two downloadable assets, and the notes are text
          # for the release page rather than something a download is verified against. Written by the tool rather
          # than by a redirect, because a PowerShell redirect writes UTF-16.
          node tools/release-notes.mjs "v${{ steps.version.outputs.version }}" --out out/RELEASE-NOTES.md
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VtuberMonitorLink-win-x64
          path: out/*
          if-no-files-found: error

      # A tag push must not silently replace a release that is already published.
      #
      # Found the hard way: v1.0.7 was published by hand with assets that had been built and verified
      # locally, and pushing its tag started this workflow, which would have uploaded a different zip
      # over them -- different in bytes because make-zip stamps every entry with the current time, so
      # even an identical build produces a different file. Nothing in the workflow would have said so,
      # and the checksums already published in SHA256SUMS.txt would have described a file that no longer
      # existed.
      #
      # So: if the tag already has assets, this fails instead. Re-releasing a version is a decision, and
      # the way to make it is to delete the assets first -- deliberately, knowing what it costs.
      - name: Refuse to replace assets that are already published
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $existing = gh release view $tag --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "no release for $tag yet; this run will create it"
            exit 0
          }
          $names = @($existing | Where-Object { $_ })
          if ($names.Count -eq 0) {
            Write-Host "the release for $tag has no assets yet; nothing to replace"
            exit 0
          }
          Write-Host "::error::$tag already has $($names.Count) published asset(s): $($names -join ', ')"
          Write-Host "This run would replace them with a rebuild, which is never byte-identical"
          Write-Host "(make-zip stamps each entry with the current time). If replacing is intended, delete"
          Write-Host "the assets on the release first, then re-run this workflow."
          exit 1

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.manifest.json
            out/SHA256SUMS.txt
          generate_release_notes: true
          # The body is the repository's own notes for this version, so the release page and docs/RELEASE.md cannot
          # drift apart - one source, and the generated changelog is appended by the action on top of it.
          body_path: out/RELEASE-NOTES.md
