name: workers

# The multilingual worker layer, built and diffed on three platforms.
#
# This is what "Linux adaptation" means for this layer: the same contract, the same corpus, a
# different toolchain - and the same answer. It is a separate workflow from ci.yml on purpose, since
# nothing here is packaged into the release artifact yet and a red run must not be confused with a
# red release.
#
# What each platform runs, measured rather than assumed (anything absent is a [skip], never a
# failure). The interpreter list comes from the `--list` table each leg prints, and the versions from
# the probe step below:
#   linux   - the reference (node), java, cpp (g++), go, python3, pwsh, csharp (dotnet), perl 5.38,
#             bash 5.2
#   windows - the reference, java, cpp (g++ - this runner does have it, contrary to an earlier note
#             here), go, python, pwsh, csharp, perl 5.42 on cygwin, bash 5.3
#   macos   - the reference, java, cpp (clang++), go, python3, pwsh, csharp, perl 5.44, bash 3.2.57
#   no Rscript on the linux or macos image (measured, not assumed)
#
# macOS is a gating leg as of this commit. It earned that by running the whole corpus and the fuzzer
# green twice while it was only informational - 8fd1d74, the commit that moved the C# worker onto
# `dotnet <dll>`, and fb730ea, the commit that fixed the Perl worker - so the promotion is a decision
# made on evidence rather than on optimism. If that runner turns out to flake, the flag is one word to
# put back, and putting it back is a change to a gate: it belongs in docs/BUGS.md like any other.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: workers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: false
          - os: macos-latest
            experimental: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Java is the one toolchain the runner does not ship, and java-text is in the published
      # registry, so it has to be here or the Linux job would silently skip a worker it should run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Go is present on the Linux and Windows runners but not on the macOS one, which is how the
      # first run of this job found out: the macOS job reported go-text as "no hint directories" and
      # the harness treated it as a skip. Installing it makes the three platforms comparable, which is
      # the entire point of the matrix.
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go/go.mod
          cache: false

      # No `npm ci`: the harness and the reference implementation use Node's standard library only,
      # and a dependency-free layer that proves it on every push is worth more than a cache.
      - name: Build every implementation that can be built here, then diff the corpus
        run: node tools/workers.mjs

      # Measured rather than assumed, on all three platforms at once. The Perl implementation lives in
      # the machine-local overlay because nobody had checked whether `perl` is on these runners; "it
      # probably is" is not a measurement, and the cheapest way to get one is to ask the runners. This
      # step prints the version or says it is absent and never fails, so the answer arrives in the log
      # without touching the gate.
      - name: Does this runner have Perl? (measured, not assumed)
        shell: bash
        run: |
          perl -e 'print "perl $^V on $^O\n"' 2>/dev/null || echo "perl: absent on this runner"

      # The next two promotion candidates out of the machine-local overlay, asked the same way and in
      # the same place. R is the case where the answer is genuinely open; the shell is the case where
      # presence is certain and the *version* is the question - macOS runner images ship bash 3.2, and
      # workers/bash/README.md says in as many words that the file has not been tested on Linux or
      # macOS bash. That worker's own self-check is deliberately NOT run here: it belongs under the
      # harness, which enforces a per-worker budget and kills a worker that overruns, whereas this step
      # has no timeout of its own and a hang here would be a hung job. Versions first, verdict later.
      - name: Do these runners have R and the shell the worker would need? (measured, not assumed)
        shell: bash
        run: |
          if command -v Rscript >/dev/null 2>&1; then Rscript --version 2>&1 | head -1; else echo "Rscript: absent on this runner"; fi
          if command -v bash >/dev/null 2>&1; then bash --version | head -1; else echo "bash: absent on this runner"; fi

      # The corpus is a floor, not a ceiling: this points the same diff at generated input, seeded so a
      # divergence is reproducible. It is what found the PowerShell worker rejecting every astral code
      # point, which the hand-written corpus had missed.
      - name: Diff the implementations over generated input
        shell: bash
        run: node tools/workers-diff.mjs --n 150 --seed 20260101

      - name: Report which implementations this platform ran
        if: always()
        shell: bash
        run: node tools/workers.mjs --list || true

      - name: Note a red run in the summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### workers: conformance failed on ${{ matrix.os }}"
            echo
            echo "Every implementation that answered agrees, or one of them does not follow the contract."
            echo "The DIVERGES lines name the implementations and show their answers side by side;"
            echo "docs/WORKERS.md section 5 says which of the two is at fault when they disagree."
          } >> "$GITHUB_STEP_SUMMARY"
