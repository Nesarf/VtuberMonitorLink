name: release

# Builds the portable .exe on a clean Windows runner.
#   - push a tag like v1.0.0  -> builds and attaches the zip to a GitHub Release
#   - run manually            -> builds and uploads the zip as a workflow artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the portable release
        run: npm run build:exe

      - name: Proofread the release folder
        run: npm run verify

      - name: Check the sources for leaked paths and secrets
        run: npm run sanitize-check

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip the release
        shell: pwsh
        run: |
          $name = "VtuberMonitorLink-${{ steps.version.outputs.version }}-win-x64"
          Compress-Archive -Path dist/VtuberMonitorLink -DestinationPath "dist/$name.zip"

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VtuberMonitorLink-win-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
