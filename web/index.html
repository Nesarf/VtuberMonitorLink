<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vtuber's Monitor Link</title>
    <!--
      Client error beacon

      Why it has to exist: when React throws something like #310, the whole tree is unmounted and the
      page goes white, while **the server sees nothing at all** -- the request log only records HTTP,
      and an error raised inside the browser cannot get out. Diagnosing it then needs a human watching
      the screen, which is not acceptable for continuous monitoring.
      So this attaches its listeners before any module loads: page errors, unhandled promises and
      console errors each send one entry to /api/client-log, which lands in the server log and in
      logs/client-errors.jsonl.
      Note: it reports the error itself only (message, source and line), never any user data.
    -->
    <script>
      (function () {
        var seen = {};
        function send(kind, message, extra) {
          try {
            var key = kind + '|' + String(message).slice(0, 120);
            // An error rethrown over and over (a render loop, say) is reported once, so it does not drown the log
            if (seen[key]) return;
            seen[key] = 1;
            var payload = JSON.stringify({
              kind: kind,
              message: String(message).slice(0, 800),
              source: (extra && extra.source) || null,
              line: (extra && extra.line) || null,
              col: (extra && extra.col) || null,
              stack: (extra && extra.stack ? String(extra.stack).slice(0, 1200) : null),
              href: location.pathname + location.hash,
              ua: navigator.userAgent.slice(0, 120),
              at: new Date().toISOString(),
            });
            if (navigator.sendBeacon) navigator.sendBeacon('/api/client-log', new Blob([payload], { type: 'application/json' }));
            else fetch('/api/client-log', { method: 'POST', headers: { 'content-type': 'application/json' }, body: payload, keepalive: true });
          } catch (e) {
            /* If reporting itself fails, so be it -- it must never throw an error of its own */
          }
        }
        window.addEventListener('error', function (ev) {
          if (ev && ev.target && ev.target.tagName && ev.target !== window) {
            send('resource', ev.target.tagName + ' failed to load: ' + (ev.target.src || ev.target.href || ''));
            return;
          }
          send('error', (ev && (ev.message || (ev.error && ev.error.message))) || 'unknown error', {
            source: ev && ev.filename,
            line: ev && ev.lineno,
            col: ev && ev.colno,
            stack: ev && ev.error && ev.error.stack,
          });
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason;
          send('rejection', (r && (r.message || r)) || 'unhandled rejection', { stack: r && r.stack });
        });
        var origError = console.error;
        console.error = function () {
          try {
            send('console', Array.prototype.map.call(arguments, function (a) {
              return a && a.message ? a.message : String(a);
            }).join(' ').slice(0, 400));
          } catch (e) {}
          return origError.apply(console, arguments);
        };
      })();
    </script>
    <!--
      Paint the theme before the first frame

      The default theme is dark (in the CSS, :root itself is dark), but the configuration has to come
      from the API, so one frame is painted in between: when the system is light and the user has
      chosen dark, that frame is white -- a white flash on every reload.
      So this reads the last used value **synchronously**; the server configuration overwrites it once
      it arrives (that one is authoritative).
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vml-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
