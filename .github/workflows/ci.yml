name: ci

# Fast feedback on every push: does the frontend build, does the source stay
# free of hard-coded machine paths and secrets, is every commit message English,
# and does the launcher still resolve a layout correctly.
#
# Two jobs on purpose:
#   * `check` (ubuntu) — the cheap platform-independent things.
#   * `fast`  (windows) — the whole `verify:fast` chain. It used to run only on a release tag,
#     which is exactly how a Windows-only failure stayed invisible until release day (BUGS #71);
#     running it on every push makes that class of "green here, red there" show up immediately.
#     Its failing step also emits a check annotation, because reading the job log needs a token
#     while annotations are public — a red build should stay diagnosable from outside.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history on purpose: the commit-message check reads every commit, and a shallow
      # clone would only be able to judge the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Check the sources for leaked paths and secrets
        run: npm run sanitize-check

      # The same rules, pointed at every blob that has ever been committed. A file deleted in a later commit is
      # still in the history, and so is whatever was in it - which is why "the tree is clean" was never the whole
      # question. Findings that are accepted are named and counted in a baseline, so this fails on anything new.
      - name: Check the committed history for traces
        run: npm run sanitize:history

      - name: Check that every commit message is English
        run: npm run commit-msg

      - name: Check syntax of the shipped scripts
        run: |
          node --check launcher/launch.cjs
          node --check tools/build-portable.cjs
          node --check tools/verify-release.cjs
          node --check tools/traverse-release.cjs
          node --check tools/traverse-ui.cjs

      - name: The launcher resolves a source checkout
        run: node launcher/launch.cjs --doctor

      - name: The launcher prints its layout
        run: node launcher/launch.cjs --paths

      - name: Verify the ASCII-only requirement for the quickstart
        run: |
          node -e "const s=require('fs').readFileSync('launcher/launch.cjs','utf8'); if(/[^\x00-\x7F]/.test(s)){console.error('launch.cjs is not ASCII');process.exit(1)}"
          node -e "const s=require('fs').readFileSync('launcher/launch.cmd','utf8'); if(/[^\x00-\x7F]/.test(s)){console.error('launch.cmd is not ASCII');process.exit(1)}"
          node -e "const s=require('fs').readFileSync('launcher/launch.sh','utf8'); if(/[^\x00-\x7F]/.test(s)){console.error('launch.sh is not ASCII');process.exit(1)}"

  fast:
    runs-on: windows-latest
    # The engine lives in the checkout, not in the platform default location, and it is set for the whole
    # job rather than for the install step alone: Playwright resolves PLAYWRIGHT_BROWSERS_PATH at module
    # load, so a variable that existed only while the download ran would be gone by the time the check
    # that has to *find* the engine starts - and the check would silently report the environment instead.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The engine, so that the browser check in `verify:fast` really renders a page here instead of
      # printing its environment statement.
      #
      # `npm ci --ignore-scripts` is deliberate (Playwright's postinstall would download ~150 MB into a
      # system location), and the consequence was that tools/browser-engine-test.mjs could only ever take
      # its "no discoverable engine" branch in this job: the build was green whether or not the render
      # worked. So the download happens here, once, for the one job that needs it - `release.yml`'s build
      # job stays as fast as it was, and the packaged release gets its engine from --with-browsers.
      #
      # Three properties are on purpose:
      #   * the install target is the repository (`PLAYWRIGHT_BROWSERS_PATH` at the job level), never
      #     %LOCALAPPDATA%\ms-playwright: the engine belongs to this checkout, and a repo-local path is
      #     the layout `firefoxBuildRoots()` already resolves first;
      #   * a failed download is **not** a red build. It is retried, and if it still fails the step warns
      #     and exits 0 by itself, so the honest environment statement is what the check reports - a flaky
      #     CDN must not turn into a red build in the job that exists to give fast feedback on the source.
      #     (`continue-on-error: true` would have the same effect on the run, and is deliberately not used:
      #     it marks the step red in the UI for a failure that is being *tolerated* on purpose, and a red
      #     marker nobody acts on is how people learn to ignore the colour.)
      #     What must never happen is the opposite - a *reporting* failure staying green - and that stays
      #     covered by `verify:fast`'s own exit code;
      #   * the payload is reported (`firefox-*` directories found), because "the engine is present" is
      #     the fact the render branch depends on and an install that silently installed nothing would
      #     otherwise read as success.
      - name: Install the browser engine (Firefox) for the render check
        id: engine
        shell: pwsh
        timeout-minutes: 15
        run: |
          $target = $env:PLAYWRIGHT_BROWSERS_PATH
          Write-Host "engine root: $target"
          $ok = $false
          foreach ($attempt in 1..3) {
            # npx.cmd, not npx: pwsh does not resolve the extensionless shim the way cmd does.
            & npx.cmd --yes playwright install firefox
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning title=engine install attempt $attempt failed::npx playwright install firefox exited $LASTEXITCODE"
            Start-Sleep -Seconds (5 * $attempt)
          }
          $found = @(Get-ChildItem -Path $target -Directory -Filter 'firefox-*' -ErrorAction SilentlyContinue)
          if ($found.Count -gt 0) {
            Write-Host "engine present: $($found.Name -join ', ')"
          } else {
            Write-Host "::warning title=no engine installed::the render check will report this machine's environment instead of rendering, which is not a failure"
          }
          if (-not $ok) { Write-Host "the engine could not be downloaded; verify:fast still runs and will say so" }

      - name: Fast checks (integrity, locales, i18n keys, plural forms, unit tests)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'verify-fast.log'
          npm run verify:fast *> $log
          $code = $LASTEXITCODE
          Get-Content $log
          if ($code -ne 0) {
            # The failing check by name, before the tail. A tail is a guess about where the failure is:
            # a suite that prints hundreds of [ok] lines after the failing one puts the cause out of the
            # window, which is how two red runs on this repository had to be diagnosed from the job log with
            # a token. The line above a [FAIL] is usually that suite's banner, so it is kept with it.
            $all = Get-Content $log
            $named = @()
            for ($i = 0; $i -lt $all.Count; $i++) {
              if ($all[$i] -match '\[FAIL\]|\bFAILED\b|AssertionError') {
                $prev = if ($i -gt 0 -and $all[$i - 1] -notmatch '^\s*\[ok\]') { $all[$i - 1].Trim() } else { '' }
                $named += (@($prev, $all[$i].Trim()) | Where-Object { $_ }) -join ' | '
              }
            }
            if ($named.Count -gt 0) {
              $f = (($named | Select-Object -First 12) -join "`n") -replace '%', '%25'
              $f = $f -replace "`r?`n", '%0A'
              Write-Host "::error title=the failing checks::$f"
            }
            # 30 lines, not 12: the identity of the failing check is in the *last lines of that check's
            # output*, and 12 of them put the name out of reach from outside - which is exactly how the
            # last red run had to be diagnosed from the job log with a token.
            $tail = (Get-Content $log -Tail 30) -join "`n"
            $tail = $tail -replace '%', '%25'
            $tail = $tail -replace "`r?`n", '%0A'
            Write-Host "::error title=verify:fast failed::$tail"
          }
          exit $code

